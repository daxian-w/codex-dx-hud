name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Build
        shell: pwsh
        run: |
          ./scripts/verify.ps1
          ./scripts/build.ps1

      - name: Verify usage refresh, authentication, scale and overlay behavior
        shell: pwsh
        run: |
          ./scripts/test-usage-refresh.ps1
          ./scripts/test-auth-recovery-regression.ps1
          ./scripts/test-scale-migration.ps1
          ./scripts/test-usage-panels.ps1
          ./scripts/test-window-attachment.ps1
          ./scripts/test-fullscreen-overlay.ps1
          ./scripts/test-overlay-dpi.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CodexRateMonitor-windows
          path: artifacts/CodexRateMonitor/
          if-no-files-found: error
          retention-days: 7
